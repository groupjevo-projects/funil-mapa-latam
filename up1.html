<!doctype html>
<html lang="es-419">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protocolo Reconexión en Pareja | Mapa del Placer Masculino</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    /* Paleta y tipografía tomadas de la página de ventas (style.css) */
    :root {
      --black: #17120f;
      --panel: #1a1a19;
      --cream: #fff0dd;
      --paper: #fff5e8;
      --ink: #201714;
      --red: #b9473c;
      --green: #22c55e;
      --muted: #6c5b50;
      --line: #34322d;
    }

    * { box-sizing: border-box; }

    html { background: var(--black); scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--black);
      color: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    /* ---------- Bloque VSL ---------- */
    .vsl-section {
      background: var(--black);
      text-align: center;
      padding: 22px 20px 28px;
    }

    .vsl-section h1 {
      max-width: 27ch;
      margin: 0 auto 12px;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 800;
      font-size: clamp(18px, 4.4vw, 29px);
      line-height: 1.16;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .subhead-bar {
      display: inline-block;
      max-width: 24ch;
      margin: 0 auto 20px;
      padding: 5px 13px;
      background: var(--red);
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      font-size: clamp(13px, 3vw, 18px);
      line-height: 1.28;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .vsl-player {
      position: relative;
      width: min(400px, 92vw);
      aspect-ratio: 4 / 5;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 4px;
      background: #000;
    }

    .vsl-player vturb-smartplayer,
    .vsl-player > div[data-vturb] {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Marcador visual mientras no hay player VTURB real */
    .vsl-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 10px;
      background: #0c0a09;
    }

    .vsl-placeholder .play {
      width: 62px;
      height: 62px;
      margin: 0 auto;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      display: grid;
      place-items: center;
    }

    .vsl-placeholder .play::after {
      content: "";
      width: 0;
      height: 0;
      margin-left: 4px;
      border-style: solid;
      border-width: 11px 0 11px 18px;
      border-color: transparent transparent transparent #17120f;
    }

    /* ---------- CTA ---------- */
    .cta-wrap {
      width: min(400px, 92vw);
      margin: 22px auto 0;
    }

    .checkout-btn {
      display: inline-block;
      width: 100%;
      padding: 16px 22px;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 800;
      font-size: clamp(15px, 3.6vw, 17.6px);
      line-height: 1.3;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      animation: ctaPulse 2.2s infinite;
    }

    .checkout-btn:hover,
    .checkout-btn:focus-visible {
      background: #1eb257;
      outline: 0;
    }

    @keyframes ctaPulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
      70% { box-shadow: 0 0 0 16px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    @media (max-width: 420px) {
      .vsl-section { padding: 18px 16px 24px; }
      .vsl-section h1 { max-width: 24ch; }
      .subhead-bar { max-width: 22ch; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="vsl-section" aria-label="Recomendación opcional: Protocolo Reconexión en Pareja">
      <!-- BORRADOR — refinar copy -->
      <h1>¡Felicitaciones! Tu acceso al Mapa del Placer Masculino ya quedó reservado</h1>
      <span class="subhead-bar">Pero antes necesito darte un aviso</span>

      <div class="vsl-player" id="vslPlayer">
        <div class="vsl-placeholder" id="vslPlaceholder">
          <div class="play" aria-hidden="true"></div>
        </div>
      </div>

      <div class="cta-wrap" id="ctaWrap" hidden>
        <a class="checkout-btn" id="checkoutBtn" href="#" rel="nofollow">Sí, quiero el Protocolo Reconexión</a>
      </div>
    </section>
  </main>

  <script>
    // ---- Configuración (rellenar antes de enviar tráfico) ----
    // TODO owner: enlace real del checkout de Hotmart (oferta "Protocolo
    // Reconexión en Pareja", US$39).
    const CHECKOUT_URL = "https://pay.hotmart.com/PENDIENTE-LINK-CHECKOUT-PROTOCOLO-US39";
    // TODO owner: player VTURB del VSL de Upsell 1. Con ambos vacíos se
    // muestra el marcador sin video.
    const VTURB_PLAYER_ID = "";
    const VTURB_PLAYER_SCRIPT = "";
    // El botón de compra aparece cuando el VSL llega a este punto: 7:02.
    const REVEAL_AT_SECONDS = 422;
    // Sin player no hay video que llegue a los 422s, así que el botón queda
    // oculto. Para revisar el diseño del botón: abrir la página con ?preview=1.

    const ctaWrap = document.getElementById("ctaWrap");
    const checkoutBtn = document.getElementById("checkoutBtn");
    const playerEl = document.getElementById("vslPlayer");
    const placeholder = document.getElementById("vslPlaceholder");

    checkoutBtn.setAttribute("href", CHECKOUT_URL);

    let revealed = false;
    function revealCta() {
      if (revealed) return;
      revealed = true;
      ctaWrap.hidden = false;
      ctaWrap.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function mountVturb() {
      if (!VTURB_PLAYER_ID || !VTURB_PLAYER_SCRIPT) return false;
      placeholder.remove();
      const player = document.createElement("vturb-smartplayer");
      player.id = VTURB_PLAYER_ID;
      player.setAttribute("style", "display:block;width:100%;height:100%;");
      playerEl.insertBefore(player, playerEl.firstChild);
      const s = document.createElement("script");
      s.src = VTURB_PLAYER_SCRIPT;
      s.async = true;
      document.head.appendChild(s);
      return true;
    }

    function watchVideoTime() {
      // Igual que la página de ventas: revelar el botón cuando el VSL llega
      // al punto de oferta.
      const timer = setInterval(function () {
        const sp = window.smartplayer;
        const instances = sp && sp.instances;
        let t = null;
        if (instances && instances.length) {
          for (let i = 0; i < instances.length; i++) {
            const v = instances[i] && instances[i].video;
            if (v && typeof v.currentTime === "number") { t = v.currentTime; break; }
          }
        }
        if (t === null) {
          const el = document.querySelector("vturb-smartplayer video");
          if (el && typeof el.currentTime === "number") t = el.currentTime;
        }
        if (t !== null && t >= REVEAL_AT_SECONDS) {
          clearInterval(timer);
          revealCta();
        }
      }, 1000);
    }

    if (mountVturb()) {
      if (REVEAL_AT_SECONDS <= 0) revealCta();
      else watchVideoTime();
    } else if (new URLSearchParams(location.search).has("preview")) {
      revealCta();
    }
  </script>
</body>
</html>
