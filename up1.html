  <script>
    // ---- Configuración ----
    // Al hacer clic en el botón verde se monta el widget de Sales Funnel de
    // Hotmart (checkout de 1 clic). No usa enlace: Hotmart identifica la
    // oferta por el token de compra que trae la URL desde el paso anterior.
    const HOTMART_ELEMENTS_LIB = "https://checkout.hotmart.com/lib/hotmart-checkout-elements.js";
    // El botón de compra aparece cuando el VSL llega al pitch de precio:
    // 6:35 = 395 s. Para revisar el botón sin esperar: abrir con ?preview=1.
    const REVEAL_AT_SECONDS = 395;

    const ctaWrap = document.getElementById("ctaWrap");
    const checkoutBtn = document.getElementById("checkoutBtn");

    let hotmartLibPromise = null;
    function loadHotmartElements() {
      if (!hotmartLibPromise) {
        hotmartLibPromise = new Promise(function (resolve, reject) {
          const tag = document.createElement("script");
          tag.src = HOTMART_ELEMENTS_LIB;
          tag.async = true;
          tag.onload = resolve;
          tag.onerror = reject;
          document.head.appendChild(tag);
        });
      }
      return hotmartLibPromise;
    }
    loadHotmartElements().catch(function () {});

    checkoutBtn.addEventListener("click", function () {
      checkoutBtn.hidden = true;
      const mount = document.getElementById("hotmartMount");
      const funnelEl = document.getElementById("hotmart-sales-funnel");
      const fallback = document.getElementById("hotmartFallback");
      mount.hidden = false;
      document.getElementById("fbRetry").addEventListener("click", function () {
        window.location.reload();
      });
      loadHotmartElements()
        .then(function () {
          window.checkoutElements.init("salesFunnel").mount("#hotmart-sales-funnel");
        })
        .catch(function () { fallback.hidden = false; });
      window.setTimeout(function () {
        if (!funnelEl.childElementCount) fallback.hidden = false;
      }, 7000);
      mount.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });

    let revealed = false;
    function revealCta() {
      if (revealed) return;
      revealed = true;
      ctaWrap.hidden = false;
      ctaWrap.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function watchVideoTime() {
      // Igual que la página de ventas: revelar el botón cuando el VSL llega
      // al punto de oferta.
      const timer = setInterval(function () {
        const sp = window.smartplayer;
        const instances = sp && sp.instances;
        let t = null;
        if (instances && instances.length) {
          for (let i = 0; i < instances.length; i++) {
            const v = instances[i] && instances[i].video;
            if (v && typeof v.currentTime === "number") { t = v.currentTime; break; }
          }
        }
        if (t === null) {
          const el = document.querySelector("vturb-smartplayer video");
          if (el && typeof el.currentTime === "number") t = el.currentTime;
        }
        if (t !== null && t >= REVEAL_AT_SECONDS) {
          clearInterval(timer);
          revealCta();
        }
      }, 1000);
    }

    if (new URLSearchParams(location.search).has("preview") || REVEAL_AT_SECONDS <= 0) {
      revealCta();
    } else {
      watchVideoTime();
    }
  </script>
