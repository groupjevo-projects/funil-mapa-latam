<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pompoarismo de las Diosas | Sofía Vilar</title>
  <style>
    :root {
      --bg: #f7f7f4;
      --surface: #ffffff;
      --surface-soft: #fff4f1;
      --ink: #211f20;
      --muted: #665f61;
      --line: #dfd7d3;
      --red: #d83a2f;
      --red-dark: #a32620;
      --teal: #153d3a;
      --teal-soft: #e8f0ee;
      --gold: #b9822d;
      --shadow: 0 20px 60px rgba(29, 28, 27, 0.13);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      width: 100%;
      max-width: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      width: 100%;
      max-width: 100%;
      margin: 0;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
      letter-spacing: 0;
      overflow-x: hidden;
      background:
        linear-gradient(180deg, rgba(216, 58, 47, 0.08), rgba(21, 61, 58, 0.04) 32%, transparent 72%),
        var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(820px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      align-items: start;
      align-content: start;
      min-width: 0;
    }

    .conversion-hero {
      padding: 10px 0 0;
      text-align: center;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      box-shadow: none;
      min-width: 0;
    }

    .hero-kicker {
      display: inline-block;
      margin: 0;
      padding: 5px 9px;
      color: #211f20;
      font-size: 0.78rem;
      font-weight: 950;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 4px;
      background: linear-gradient(90deg, #fff06a, #ffb35c, #ff7670, #ffd86b, #fff06a);
      background-size: 320% 100%;
      box-shadow: 0 0 0 1px rgba(163, 38, 32, 0.1), 0 8px 22px rgba(216, 58, 47, 0.16);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.36);
      animation: highlightShift 1800ms linear infinite;
    }

    h1 {
      margin: 6px auto 0;
      font-size: clamp(2rem, 4.9vw, 4rem);
      line-height: 0.95;
      letter-spacing: 0;
      max-width: 18ch;
    }

    .danger-highlight {
      color: var(--red-dark);
    }

    .hero-copy {
      max-width: 31rem;
      margin: 8px auto 0;
      color: var(--muted);
      font-size: 1rem;
      overflow-wrap: break-word;
    }

    .hero-copy strong {
      display: block;
      margin-bottom: 3px;
      color: var(--red-dark);
      font-size: 1.05rem;
      font-weight: 900;
      overflow-wrap: break-word;
    }

    .chat-shell {
      min-height: min(500px, calc(100vh - 270px));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
    }

    .chat-header {
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .avatar {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #fff;
      background: var(--surface-soft);
      box-shadow: 0 0 0 1px var(--line), 0 8px 18px rgba(216, 58, 47, 0.18);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 24%;
      display: block;
    }

    .profile h2 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.1;
    }

    .profile p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .status-pill {
      min-width: max-content;
      padding: 8px 10px;
      border-radius: 999px;
      background: var(--teal-soft);
      color: var(--teal);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .progress {
      height: 3px;
      background: #eee6e3;
    }

    .progress-bar {
      width: 8%;
      height: 100%;
      background: var(--red);
      transition: width 280ms ease;
    }

    .messages {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 22px 18px 28px;
      background:
        linear-gradient(180deg, rgba(255, 244, 241, 0.58), rgba(255, 255, 255, 0) 180px),
        var(--surface);
    }

    .row {
      display: flex;
      gap: 10px;
      margin: 0 0 12px;
      align-items: flex-end;
      min-width: 0;
      animation: rise 220ms ease-out;
    }

    .row.user {
      justify-content: flex-end;
    }

    .mini-avatar {
      display: none;
    }

    .bubble {
      max-width: min(570px, 86%);
      padding: 12px 14px;
      border-radius: 16px 16px 16px 6px;
      background: #f3f0ed;
      color: var(--ink);
      font-size: 0.96rem;
      white-space: pre-line;
    }

    .bubble.user {
      max-width: min(520px, 88%);
      border-radius: 16px 16px 6px 16px;
      background: var(--teal);
      color: #fff;
    }

    .bubble.offer {
      width: min(540px, 90%);
      max-width: min(540px, 90%);
      padding: 0;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .offer-head {
      padding: 16px;
      background: var(--surface-soft);
      border-bottom: 1px solid var(--line);
    }

    .offer-head strong {
      display: block;
      font-size: 1.08rem;
    }

    .offer-head span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .offer-body {
      padding: 14px 16px 16px;
    }

    .stack {
      display: grid;
      gap: 9px;
      margin: 0 0 14px;
      padding: 0;
      list-style: none;
    }

    .stack li {
      display: grid;
      grid-template-columns: 20px 1fr;
      gap: 9px;
      align-items: start;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--teal);
      font-size: 0.8rem;
      font-weight: 900;
    }

    .price {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .price del {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .price strong {
      color: var(--red-dark);
      font-size: 1.55rem;
      line-height: 1;
    }

    .price small {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .typing {
      width: 58px;
      padding: 11px 12px;
      display: inline-flex;
      gap: 4px;
      border-radius: 14px 14px 14px 5px;
      background: #f3f0ed;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.65;
      animation: blink 960ms infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 120ms;
    }

    .typing span:nth-child(3) {
      animation-delay: 240ms;
    }

    .composer {
      border-top: 1px solid var(--line);
      background: var(--surface);
      padding: 16px 18px;
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .choice:hover,
    .choice:focus-visible {
      border-color: var(--red);
      background: var(--surface-soft);
      outline: 0;
      transform: translateY(-1px);
    }

    .choice.primary {
      border-color: var(--red);
      background: var(--red);
      color: #fff;
      font-weight: 850;
      text-align: center;
    }

    .choice.primary:hover,
    .choice.primary:focus-visible {
      background: var(--red-dark);
    }

    .choice.secondary {
      color: var(--muted);
      text-align: center;
    }

    .hotmart-slot {
      margin-top: 10px;
      padding: 12px;
      border: 1px dashed #c9bbb6;
      border-radius: var(--radius);
      background: #fbfaf8;
    }

    .slot-label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
    }

    .demo-video-card {
      width: min(540px, 90%);
      max-width: min(540px, 90%);
      padding: 0;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .demo-video-card .offer-head {
      background: linear-gradient(135deg, #fff4f1, #fffaf6);
    }

    .demo-kicker {
      display: block;
      margin-bottom: 5px;
      color: var(--red-dark);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .vturb-frame {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 6px;
      background: #211f20;
    }

    .vturb-frame vturb-smartplayer {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    .vturb-player-placeholder {
      position: relative;
      width: 100%;
      padding: 125% 0 0;
      z-index: 0;
      background: #000;
    }

    .video-caption {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.35;
      text-align: center;
    }

    @media (max-width: 560px) {
      .demo-video-card {
        width: min(86vw, 340px);
        max-width: min(86vw, 340px);
      }
    }

    .modal {
      width: min(430px, calc(100% - 32px));
      border: 0;
      border-radius: var(--radius);
      padding: 0;
      box-shadow: var(--shadow);
    }

    .modal::backdrop {
      background: rgba(33, 31, 32, 0.44);
    }

    .modal-body {
      padding: 20px;
    }

    .modal-body h2 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .modal-body p {
      margin: 0 0 14px;
      color: var(--muted);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.38;
      }
      40% {
        transform: translateY(-3px);
        opacity: 0.9;
      }
    }

    @keyframes highlightShift {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 320% 50%;
      }
    }

    @media (max-width: 920px) {
      .page {
        padding: 16px 0;
      }

      h1 {
        max-width: 16ch;
      }

      .chat-shell {
        min-height: 520px;
      }
    }

    @media (max-width: 560px) {
      .page {
        width: 100vw;
        max-width: 100vw;
        min-height: 100vh;
        padding: 0;
        gap: 0;
        overflow: hidden;
      }

      .conversion-hero {
        width: 100vw;
        max-width: 100vw;
        padding: 16px 18px 8px;
      }

      h1 {
        font-size: clamp(1.75rem, 9vw, 2.45rem);
        max-width: 12ch;
      }

      .hero-copy {
        font-size: 0.96rem;
        width: auto;
        max-width: 320px;
      }

      .chat-shell {
        width: 100vw;
        max-width: 100vw;
        min-height: calc(100vh - 264px);
        border: 0;
        border-radius: 0;
      }

      .status-pill {
        display: none;
      }

      .messages {
        padding: 18px 12px 24px;
      }

      .composer {
        padding: 12px;
      }

      .bubble {
        max-width: min(83vw, 330px);
        min-width: 0;
        overflow-wrap: break-word;
      }

      .bubble.user {
        max-width: min(86vw, 340px);
      }

      .bubble.offer {
        width: min(86vw, 340px);
        max-width: min(86vw, 340px);
      }
    }

    @media (max-width: 360px) {
      h1,
      .hero-copy {
        width: 284px;
        max-width: 284px;
      }
    }
    .confirmation-topline {
      display: inline-flex;

    }

    .confirmation-check {

    .order-status-grid {
      display: grid;

    }

    .order-status {

    }

    .order-status strong {
      flex: 0 0 auto;

    }

    .order-status span {
      overflow-wrap: anywhere;
    }

      border-right: 9px solid transparent;

    /* Paleta modelada a partir do projeto downsell enviado. */
    :root {
      --bg: #100e13;
      --surface: #17131a;
      --surface-soft: #241524;
      --ink: #f5edf2;
      --muted: #b9aeb8;
      --line: rgba(244, 184, 221, .18);
      --red: #f04c9a;
      --red-dark: #d93686;
      --teal: #f04c9a;
      --teal-soft: rgba(240, 76, 154, .13);
      --gold: #ff856f;
      --shadow: 0 20px 70px rgba(0, 0, 0, .42);
    }

    html,
    body {
      background: #100e13;
      color: var(--ink);

    body {

    function sleep(ms) {

    function scrollToBottom() {

    }

      state.progress = value;
      progressBar.style.width = `${value}%`;

      const avatar = document.createElement("div");

      const row = document.createElement("div");
      row.className = `row ${sender}`;

      const bubble = document.createElement("div");

      bubble.textContent = text;

      if (sender === "bot") row.appendChild(avatarNode());
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function addTyping() {
      const row = document.createElement("div");
      row.className = "row";
      row.dataset.typing = "true";

      typing.className = "typing";
      typing.setAttribute("aria-label", "Sofía está escribiendo");
      typing.innerHTML = "<span></span><span></span><span></span>";
      row.appendChild(typing);
      messagesEl.appendChild(row);
      scrollToBottom();
      return row;
    }

    async function botSpeak(lines) {
      for (const item of lines) {
        const typing = addTyping();
        await sleep(520 + Math.min(resolveText(item).length * 8, 700));
        typing.remove();
        addMessage(resolveText(item));
        await sleep(180);
      }
    }

    function renderChoices(step) {
      choicesEl.innerHTML = "";
      step.choices.forEach(choice => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `choice ${choice.primary ? "primary" : ""} ${choice.secondary ? "secondary" : ""}`;
        button.textContent = choice.text;
        button.addEventListener("click", () => choose(choice, step));
        choicesEl.appendChild(button);
      });
    }

    async function choose(choice, step) {
      choicesEl.innerHTML = "";
      addMessage(choice.text, "user");

      if (step.store) {
        state.answers[step.store] = choice.value;
      }

      if (choice.action === "checkout") {
        window.location.href = CHECKOUT_URL;
        return;
      }

      if (choice.action === "thanks") {
        window.location.href = THANK_YOU_URL;
        return;
      }

      await sleep(180);
      goTo(choice.next);
    }

    async function goTo(id) {
      const step = flow[id];

      await botSpeak(step.bot || []);
      if (step.video) addVturbVideo();
      if (step.offer) addOfferCard();
      renderChoices(step);
    }
