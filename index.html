    <script>
      (function () {
        var SUPABASE_URL = 'https://ahtvpfunglhhtfpefsyi.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_MuW-XY0uxvizJ3zqtJKy5A_YMdJNrln';

        var sessionId;
        try {
          sessionId = localStorage.getItem('funnel_session_id');
          if (!sessionId) {
            sessionId = Math.random().toString(36).substring(2, 15);
            localStorage.setItem('funnel_session_id', sessionId);
          }
        } catch (e) {
          sessionId = Math.random().toString(36).substring(2, 15);
        }

        function send(row, retriesLeft) {
          fetch(SUPABASE_URL + '/rest/v1/funnel_events', {
            method: 'POST',
            keepalive: true,
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + SUPABASE_KEY,
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify([row])
          }).then(function (res) {
            if (!res.ok && retriesLeft > 0) setTimeout(function () { send(row, retriesLeft - 1); }, 1200);
          }).catch(function () {
            if (retriesLeft > 0) setTimeout(function () { send(row, retriesLeft - 1); }, 1200);
          });
        }

        // Deliberately not window.umami: analytics vendors claim that name and would
        // silently take the funnel events with them.
        window.trackFunnel = {
          track: function (eventName) {
            send({ offer_id: 'latam', event_type: eventName, session_id: sessionId }, 2);
          }
        };

        // Single source of truth for checkout clicks - the links carry no inline handler.
        document.addEventListener('click', function (e) {
          var link = e.target && e.target.closest && e.target.closest('a');
          if (link && link.href && link.href.indexOf('checkout') !== -1) {
            window.trackFunnel.track('click_checkout');
          }
        });
      })();
    </script>

        <a href="https://pay.hotmart.com/O107334406Q?checkoutMode=10&bid=1787748171026" class="checkout-btn">SÍ, QUIERO ASEGURAR MI ACCESO AHORA</a>
    </div>
    <script>
      // The sales pitch starts at 5:55 of the VSL, so that is when the checkout
      // button appears - never earlier.
      (function () {
        var REVEAL_AT = 355;
        var wrapper = document.getElementById('checkout-btn-wrapper');
        var shown = false;
        var timer;

        function currentTime() {
          var sp = window.smartplayer;
          var instances = sp && sp.instances;
          if (instances && instances.length) {
            for (var i = 0; i < instances.length; i++) {
              var video = instances[i] && instances[i].video;
              if (video && typeof video.currentTime === 'number') return video.currentTime;
            }
          }
          var el = document.querySelector('vturb-smartplayer video, .vsl-player video');
          if (el && typeof el.currentTime === 'number') return el.currentTime;
          return null;
        }

        function reveal() {
          if (shown) return;
          shown = true;
          clearInterval(timer);
          wrapper.style.display = 'block';
          var vsl = document.querySelector('.vsl-section');
          if (vsl && wrapper.parentElement !== vsl) vsl.appendChild(wrapper);
          if (window.trackFunnel) window.trackFunnel.track('cta_shown');
        }

        timer = setInterval(function () {
          var t = currentTime();
          if (t !== null && t >= REVEAL_AT) reveal();
        }, 1000);
      })();
    </script>
