    <script>
      (function () {
        var SUPABASE_URL = 'https://ahtvpfunglhhtfpefsyi.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_MuW-XY0uxvizJ3zqtJKy5A_YMdJNrln';

        var sessionId;
        try {
          sessionId = localStorage.getItem('funnel_session_id');
          if (!sessionId) {
            sessionId = Math.random().toString(36).substring(2, 15);
            localStorage.setItem('funnel_session_id', sessionId);
          }
        } catch (e) {
          sessionId = Math.random().toString(36).substring(2, 15);
        }

        function send(row, retriesLeft) {
          fetch(SUPABASE_URL + '/rest/v1/funnel_events', {
            method: 'POST',
            keepalive: true,
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + SUPABASE_KEY,
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify([row])
          }).then(function (res) {
            if (!res.ok && retriesLeft > 0) setTimeout(function () { send(row, retriesLeft - 1); }, 1200);
          }).catch(function () {
            if (retriesLeft > 0) setTimeout(function () { send(row, retriesLeft - 1); }, 1200);
          });
        }

        // Deliberately not window.umami: analytics vendors claim that name and would
        // silently take the funnel events with them.
        window.trackFunnel = {
          track: function (eventName) {
            send({ offer_id: 'latam', event_type: eventName, session_id: sessionId }, 2);
          }
        };

        // Single source of truth for checkout clicks - the links carry no inline handler.
        // Los dominios de pago cambian de plataforma. Se listan aqui para que el
        // evento no dependa de que la palabra "checkout" aparezca en la URL.
        var CHECKOUT_HOSTS = ['pay.kiwify.com', 'pay.hotmart.com', 'pay.mycheckoutt.com', 'checkout.'];
        document.addEventListener('click', function (e) {
          var link = e.target && e.target.closest && e.target.closest('a');
          if (!link || !link.href) return;
          for (var i = 0; i < CHECKOUT_HOSTS.length; i++) {
            if (link.href.indexOf(CHECKOUT_HOSTS[i]) !== -1) {
              window.trackFunnel.track('click_checkout');
              return;
            }
          }
        });
      })();
    </script>

    <div id="checkout-btn-wrapper" style="display: none; text-align: center; margin-top: 25px; padding-bottom: 40px; width: 100%; position: relative; z-index: 50;">
        <a href="https://pay.kiwify.com/kuMcuGq" class="checkout-btn">SÍ, QUIERO ASEGURAR MI ACCESO AHORA</a>
    </div>
    <script>
      // The sales pitch starts at 5:58 of the VSL, so that is when the checkout
      // button appears - never earlier.
      (function () {
        var REVEAL_AT = 358;
        var wrapper = document.getElementById('checkout-btn-wrapper');
        var shown = false;
        var timer;

        function currentTime() {
          var sp = window.smartplayer;
          var instances = sp && sp.instances;
          if (instances && instances.length) {
            for (var i = 0; i < instances.length; i++) {
              var video = instances[i] && instances[i].video;
              if (video && typeof video.currentTime === 'number') return video.currentTime;
            }
          }
          var el = document.querySelector('vturb-smartplayer video, .vsl-player video');
          if (el && typeof el.currentTime === 'number') return el.currentTime;
          return null;
        }

        // This is the only checkout button on the page. If anything else links to
        // the checkout (e.g. a CTA injected by the video player), hide it so the
        // pitch never shows two stacked buttons.
        function killOtherCtas() {
          try {
            var mine = wrapper.querySelector('.checkout-btn');
            var nodes = document.querySelectorAll('a, button, [role="button"]');
            for (var i = 0; i < nodes.length; i++) {
              var el = nodes[i];
              if (el === mine || wrapper.contains(el) || el.contains(wrapper)) continue;
              var href = (el.getAttribute && el.getAttribute('href')) || '';
              var isCheckout = /kiwify\.com|pay\.hotmart\.com|mycheckoutt\.com/.test(href) ||
                /ASEGURAR MI ACCESO/i.test(el.textContent || '');
              if (!isCheckout) continue;
              var box = el.closest('div, section') || el;
              if (box.contains(wrapper)) box = el;
              box.style.setProperty('display', 'none', 'important');
            }
          } catch (e) {}
        }

        var killPending = false;
        function scheduleKill() {
          if (killPending) return;
          killPending = true;
          setTimeout(function () { killPending = false; killOtherCtas(); }, 150);
        }
        killOtherCtas();
        if (window.MutationObserver) {
          new MutationObserver(scheduleKill).observe(document.documentElement, { childList: true, subtree: true });
        }

        function reveal() {
          if (shown) return;
          shown = true;
          clearInterval(timer);
          wrapper.style.display = 'block';
          var vsl = document.querySelector('.vsl-section');
          if (vsl && wrapper.parentElement !== vsl) vsl.appendChild(wrapper);
          killOtherCtas();
          if (window.trackFunnel) window.trackFunnel.track('cta_shown');
        }

        timer = setInterval(function () {
          var t = currentTime();
          if (t !== null && t >= REVEAL_AT) reveal();
        }, 1000);
      })();
    </script>
